name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  # Ruby puro, sem Rails.
  test-ruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # Matriz Ruby x Rails. Só combinações oficialmente compatíveis; confira a
  # tabela de compatibilidade antes de ampliar.
  test-rails:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "2.7", rails: "6_0" }
          - { ruby: "2.7", rails: "6_1" }
          - { ruby: "2.7", rails: "7_0" }
          - { ruby: "2.7", rails: "7_1" }
          - { ruby: "3.0", rails: "6_1" }
          - { ruby: "3.0", rails: "7_0" }
          - { ruby: "3.1", rails: "7_0" }
          - { ruby: "3.1", rails: "7_1" }
          - { ruby: "3.1", rails: "7_2" }
          - { ruby: "3.2", rails: "7_1" }
          - { ruby: "3.2", rails: "7_2" }
          - { ruby: "3.2", rails: "8_0" }
          - { ruby: "3.3", rails: "7_2" }
          - { ruby: "3.3", rails: "8_0" }
          - { ruby: "3.4", rails: "7_2" }
          - { ruby: "3.4", rails: "8_0" }
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
